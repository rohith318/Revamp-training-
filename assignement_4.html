<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="flex flex-col items-start bg-[url('https://ik.imagekit.io/vf9rwuh0w/Revamp%20academy/todolistbg.png_updatedAt=1700761069523')] w-[300px] h-[500px] bg-cover bg-no-repeat">

    <div class="flex flex-col items-center">

        <h1 class="font-[Roboto] text-white text-[36px] leading-[43px] font-bold">
            Todolist
        </h1>

        <p class="font-[Roboto] text-white text-center text-[12px] leading-[20px] p-4">

        </p>

    </div>

    <div class="flex flex-col items-start">

        <h2 class="font-[Roboto] text-white text-[20px] font-bold">
            Read a Book
        </h2>

        <p class="font-[Roboto] text-white text-[10px]leading-[16px] pt-6 ">

        </p>

        <div class="flex justify-center w-[300px]">
            <button class="font-[Roboto]  text-white bg-orange-400 text-[16px]font-bold px-5 py-2 mt-4">
            Start</button>
        </div>

        <div class="flex justify-center w-[300px] mt-4 ">
            <p class="font[Roboto] text-white text-[12px] text-center underline">
            Don't skip introduction
        </p>

        </div>

    </div>

</div>
