<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat UI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Main Container -->
    <div class="flex flex-col w-[280px]">

        <!-- Header -->
        <div class="flex items-center justify-center h-[40px] bg-[#344450] ">

            <h1 class="text-white text-[16px]">
                Rahul
            </h1>

        </div>

        <!-- Chat Body -->
        <div class="flex flex-col gap-2 px-3 py-4 bg-[#1d2529]">

            <!-- Right Message -->
            <p class="self-end w-[90%] bg-[#47a3f3] text-white text-[13px] text-right rounded-md py-2 px-3">
                Hello Rahul, how are you?
            </p>

            <!-- Left Message -->
            <p class="self-start w-[90%] bg-[#52606d] text-white text-[13px] rounded-md py-2 px-3">
                Hi Varakumar, I am good. How about you?
            </p>

            <!-- Right Message -->
            <p class="self-end w-[90%] bg-[#47a3f3] text-white text-[13px] text-right rounded-md py-2 px-3">
                I'm fine. I published my website recently
            </p>

            <!-- Left Message -->
            <p class="self-start w-[90%] bg-[#52606d] text-white text-[13px] rounded-md py-2 px-3">
                Oh great Varakumar! Can you send me the URL?
            </p>

            <!-- Right Message -->
            <p class="self-end w-[90%] bg-[#47a3f3] text-white text-[13px] text-right rounded-md py-2 px-3">
                https://varakumar.ccbp.tech
            </p>

            <!-- Left Message -->
            <p class="self-start w-[90%] bg-[#52606d] text-white text-[13px] rounded-md py-2 px-3">
                Awesome Varakumar, where did you learn?
            </p>

            <!-- Right Message -->
            <p class="self-end w-[90%] bg-[#47a3f3] text-white text-[13px] text-right rounded-md py-2 px-3">
                NxtWave CCBP 4.0 Program
            </p>

        </div>

    </div>

</body>
</html>
